<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recruiters — redesign v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --brand: #2563EB;
    --brand-strong: #1D4ED8;
    --brand-soft: #EFF6FF;
    --brand-line: #BFDBFE;
    --ink: #0F172A;
    --muted: #475569;
    --faint: #64748B;
    --canvas: #F9FAFB;
    --surface: #FFFFFF;
    --hairline: #E2E8F0;
    --hairline2: #CBD5E1;
    --cta: #059669;
    --danger: #DC2626;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--canvas);
    color: var(--ink);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }
  input { font: inherit; }

  /* ── app chrome ─────────────────────────────────────────── */
  .appbar {
    height: 56px; display: flex; align-items: center; gap: 14px;
    padding: 0 20px; background: var(--surface);
    border-bottom: 1px solid var(--hairline);
  }
  .logo {
    width: 30px; height: 30px; border-radius: 8px; background: var(--brand);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 15px;
  }
  .appname { font-weight: 700; font-size: 14.5px; }
  .appname small { display: block; font-size: 9.5px; letter-spacing: .14em; color: var(--faint); font-weight: 600; text-transform: uppercase; }
  .spacer { flex: 1; }
  .userchip {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--hairline); border-radius: 8px;
    padding: 5px 10px 5px 6px; background: var(--surface);
    font-size: 12.5px; font-weight: 600;
  }
  .userchip .ava { width: 22px; height: 22px; border-radius: 6px; background: #F59E0B; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  /* ── page head ──────────────────────────────────────────── */
  .page { max-width: 1440px; margin: 0 auto; padding: 26px 28px 40px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 18px; }
  .page-head h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .page-head .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .summary { font-size: 12.5px; color: var(--faint); display: flex; gap: 14px; align-items: center; }
  .summary b { color: var(--ink); font-weight: 700; }

  /* ── workspace: list + record ───────────────────────────── */
  .workspace {
    display: grid; grid-template-columns: minmax(0, 1fr) 408px;
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    min-height: 620px;
  }

  /* toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--hairline);
  }
  .search {
    flex: 1; display: flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 10px; background: var(--canvas);
    border: 1px solid var(--hairline); border-radius: 8px;
    color: var(--faint); font-size: 13px;
  }
  .search input { border: none; outline: none; background: transparent; flex: 1; color: var(--ink); font-size: 13px; }
  .search input::placeholder { color: var(--faint); }
  .search kbd {
    font-family: var(--mono); font-size: 10.5px; color: var(--faint);
    border: 1px solid var(--hairline); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 5px; background: var(--surface);
  }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 8px; overflow: hidden; }
  .seg button {
    border: none; background: var(--surface); padding: 0 12px; height: 34px;
    font-size: 12.5px; font-weight: 600; color: var(--muted);
    border-right: 1px solid var(--hairline);
  }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--brand-soft); color: var(--brand-strong); }
  .seg button span { color: var(--faint); font-weight: 500; margin-left: 5px; font-size: 11.5px; }
  .seg button.on span { color: var(--brand); }
  .select {
    height: 34px; border: 1px solid var(--hairline); border-radius: 8px;
    background: var(--surface); color: var(--muted); font-size: 12.5px; font-weight: 600;
    padding: 0 10px; display: inline-flex; align-items: center; gap: 6px;
  }

  /* list */
  .list { min-width: 0; display: flex; flex-direction: column; }
  .list-head {
    display: grid;
    grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 0.9fr) 108px;
    gap: 12px; padding: 9px 16px 9px 18px;
    border-bottom: 1px solid var(--hairline);
    font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--faint);
  }
  .rows { flex: 1; overflow: auto; }
  .row {
    display: grid;
    grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 0.9fr) 108px;
    gap: 12px; align-items: center;
    padding: 10px 16px 10px 16px;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer; position: relative;
  }
  .row:hover { background: #F8FAFC; }
  .row.sel { background: var(--brand-soft); }
  .row.sel::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--brand); }

  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mono-ava {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; letter-spacing: .02em;
    background: var(--brand-soft); color: var(--brand-strong);
  }
  .mono-ava.gray { background: #F1F5F9; color: var(--muted); }
  .who .nm { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .rl { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell-co { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell-mail { font-family: var(--mono); font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell-phone { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dash { color: var(--hairline2); }

  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .st-sent .dot { background: #10B981; } .st-sent { color: #047857; }
  .st-none .dot { background: var(--hairline2); } .st-none { color: var(--faint); font-weight: 500; }
  .st-bounce .dot { background: var(--danger); } .st-bounce { color: var(--danger); }
  .status .when { color: var(--faint); font-weight: 500; }

  /* record pane */
  .record { border-left: 1px solid var(--hairline); display: flex; flex-direction: column; min-width: 0; position: relative; }
  .record-body { padding: 22px 22px 26px; overflow: auto; flex: 1; }
  .rec-head { display: flex; gap: 14px; align-items: center; }
  .big-ava {
    width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0;
    background: var(--brand-soft); color: var(--brand-strong);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
  }
  .rec-head .name { font-size: 16.5px; font-weight: 700; letter-spacing: -0.01em; }
  .rec-head .meta { font-size: 12.5px; color: var(--faint); margin-top: 2px; }

  .rec-actions { display: flex; gap: 8px; margin: 16px 0 4px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    height: 34px; padding: 0 14px; border-radius: 8px;
    border: 1px solid var(--hairline); background: var(--surface);
    font-size: 12.5px; font-weight: 600; color: var(--ink);
  }
  .btn:hover { background: var(--canvas); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-strong); }
  .btn.icon { width: 34px; padding: 0; color: var(--muted); }
  .btn.icon:hover { color: var(--ink); }

  .sect {
    margin-top: 22px; font-size: 10.5px; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase; color: var(--faint);
    padding-bottom: 8px; border-bottom: 1px solid var(--hairline);
  }
  .props { display: flex; flex-direction: column; }
  .prop {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 9px 0; border-bottom: 1px solid var(--hairline);
    font-size: 13px;
  }
  .prop .k {
    width: 92px; flex-shrink: 0; font-size: 10.5px; font-weight: 700;
    letter-spacing: .07em; text-transform: uppercase; color: var(--faint);
    padding-top: 2px;
  }
  .prop .v { flex: 1; min-width: 0; color: var(--ink); }
  .prop .v.mono { font-family: var(--mono); font-size: 12.5px; }
  .prop .v a { color: var(--brand-strong); text-decoration: none; }
  .prop .v a:hover { text-decoration: underline; }
  .prop .empty { color: var(--hairline2); }
  .prop .add { color: var(--brand); font-size: 12px; font-weight: 600; margin-left: 8px; }
  .copy-mini {
    border: none; background: none; color: var(--faint); padding: 0 2px;
    vertical-align: middle;
  }
  .copy-mini:hover { color: var(--brand); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
    background: var(--canvas); border: 1px solid var(--hairline); color: var(--muted);
  }
  .pill.ok { background: #ECFDF5; border-color: #A7F3D0; color: #047857; }
  .pill.warn { background: #FFFBEB; border-color: #FDE68A; color: #92400E; }

  /* activity */
  .timeline { padding-top: 4px; }
  .tl-item { display: flex; gap: 12px; padding: 10px 0; }
  .tl-ico {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    border: 1px solid var(--hairline); background: var(--surface);
    display: flex; align-items: center; justify-content: center; color: var(--faint);
  }
  .tl-ico.on { background: var(--brand-soft); border-color: var(--brand-line); color: var(--brand-strong); }
  .tl-body { flex: 1; min-width: 0; }
  .tl-title { font-size: 13px; font-weight: 600; }
  .tl-sub { font-size: 12px; color: var(--faint); margin-top: 1px; }
  .tl-date { font-size: 11.5px; color: var(--faint); white-space: nowrap; font-family: var(--mono); }

  /* empty record state */
  .rec-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--faint); gap: 8px; text-align: center; padding: 40px; }
  .rec-empty .ring { width: 44px; height: 44px; border-radius: 12px; border: 1px dashed var(--hairline2); display: flex; align-items: center; justify-content: center; }

  /* compose drawer */
  .drawer {
    position: absolute; inset: 0; background: var(--surface); z-index: 5;
    display: none; flex-direction: column;
  }
  .drawer.open { display: flex; }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--hairline);
  }
  .drawer-head h3 { font-size: 14px; font-weight: 700; }
  .drawer-head .x { border: none; background: none; color: var(--faint); font-size: 16px; padding: 2px 6px; }
  .drawer-head .x:hover { color: var(--ink); }
  .drawer-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; overflow: auto; flex: 1; }
  .field label { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
  .field input[type=text], .field textarea {
    width: 100%; border: 1px solid var(--hairline); border-radius: 8px;
    padding: 9px 11px; font-size: 13px; color: var(--ink); background: var(--surface);
    outline: none; font-family: inherit;
  }
  .field input:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .field textarea { min-height: 190px; resize: vertical; line-height: 1.6; }
  .attach { display: flex; gap: 8px; }
  .drawer-foot { border-top: 1px solid var(--hairline); padding: 12px 18px; display: flex; align-items: center; gap: 10px; }
  .drawer-foot .spacer { flex: 1; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 12.5px; font-weight: 600;
    padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 1080px) {
    .workspace { grid-template-columns: 1fr; }
    .record { border-left: none; border-top: 1px solid var(--hairline); }
  }
</style>
</head>

Best,
Atanu</textarea>

  const $ = (s) => document.querySelector(s);
  let selected = contacts[0];
  let filter = 'all';
  let query = '';

  const isPersonish = (n) => /^\p{Lu}[\p{L}'’-]*\s+\p{Lu}/u.test(n);
  const initials = (c) => {
    if (isPersonish(c.name)) return c.name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    if (c.company.includes(' ')) return c.company.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    return c.company.replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase();
  };
  const statusHtml = (c) => {
    if (c.status === 'sent') return `<span class="status st-sent"><span class="dot"></span>Sent <span class="when">· ${c.when}</span></span>`;
    if (c.status === 'bounce') return `<span class="status st-bounce"><span class="dot"></span>Bounced <span class="when">· ${c.when}</span></span>`;
    return `<span class="status st-none"><span class="dot"></span>Not contacted</span>`;
  };
  const esc = (s) => s.replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  function renderList() {
    const q = query.toLowerCase();
    const rows = contacts.filter(c => {
      const byKind = filter === 'all' || c.kind === filter;
      const byQ = !q || (c.name + c.email + c.company).toLowerCase().includes(q);
      return byKind && byQ;
    });
    $('#rows').innerHTML = rows.map(c => `
      <div class="row ${c.id === selected.id ? 'sel' : ''}" data-id="${c.id}">
        <div class="who">
          <div class="mono-ava ${isPersonish(c.name) ? '' : 'gray'}">${initials(c)}</div>
          <div style="min-width:0">
            <div class="nm">${esc(c.name)}</div>
            <div class="rl">${esc(c.role)}</div>
          </div>
        </div>
        <div class="cell-co">${esc(c.company)}</div>
        <div class="cell-mail">${c.email ? esc(c.email) : '<span class="dash">—</span>'}</div>
        <div class="cell-phone">${c.phone ? esc(c.phone) : '<span class="dash">—</span>'}</div>
        <div>${statusHtml(c)}</div>
      </div>`).join('');
    $('#rows').querySelectorAll('.row').forEach(r => r.addEventListener('click', () => {
      selected = contacts.find(c => c.id === +r.dataset.id);
      renderList(); renderRecord();
    }));
    $('#s-total').textContent = rows.length === contacts.length ? 289 : rows.length;
  }

  function prop(k, v, opts = {}) {
    const value = v
      ? (opts.mono ? `<span class="mono">${esc(v)}</span>` : esc(v))
      : `<span class="empty">—</span>${opts.add ? ` <button class="copy-mini add" data-copy="" style="font-size:12px;font-weight:600;color:var(--brand)">+ Add</button>` : ''}`;
    const copy = (v && opts.copy)
      ? ` <button class="copy-mini" data-copy="${esc(v)}" title="Copy">⧉</button>` : '';
    return `<div class="prop"><div class="k">${k}</div><div class="v">${value}${copy}</div></div>`;
  }

  function renderRecord() {
    const c = selected;
    const isPerson = isPersonish(c.name);
    const html = `
      <div class="rec-head">
        <div class="big-ava">${initials(c)}</div>
        <div style="min-width:0">
          <div class="name">${esc(c.name)}</div>
          <div class="meta">${esc(c.role)} · ${esc(c.company)}</div>
        </div>
      </div>
      <div class="rec-actions">
        <button class="btn primary" id="write">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16M6 16l9.5-9.5a2.1 2.1 0 0 1 3 3L9 19H6v-3Z"/></svg>
          Write email
        </button>
        <button class="btn icon" title="Copy email" data-copy="${esc(c.email)}">⧉</button>
        <button class="btn icon" title="Verify email">✓</button>
        <button class="btn icon" title="Open job post">↗</button>
      </div>

      <div class="sect">Details</div>
      <div class="props">
        ${prop('Email', c.email, { mono: true, copy: true })}
        ${prop('Phone', c.phone, { mono: true, copy: true, add: true })}
        ${prop('LinkedIn', c.linkedin, { add: true })}
        ${prop('Company', c.company)}
        ${prop('Role', c.role)}
        ${prop('Source', c.source)}
        ${prop('Added', c.added)}
        ${prop('Outreach', c.status === 'sent' ? `Sent · ${c.when}` : c.status === 'bounce' ? `Bounced · ${c.when}` : 'Not contacted')}
        ${c.notes ? prop('Notes', c.notes) : ''}
      </div>

      <div class="sect">Activity</div>
      <div class="timeline">
        ${c.activity.map((a, i) => `
          <div class="tl-item">
            <div class="tl-ico ${i === 0 ? 'on' : ''}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            </div>
            <div class="tl-body">
              <div class="tl-title">${esc(a.t)}</div>
              <div class="tl-sub">${esc(a.s)}</div>
            </div>
            <div class="tl-date">${esc(a.d)}</div>
          </div>`).join('')}
      </div>`;
    $('#record-body').innerHTML = html;
    $('#write').addEventListener('click', () => {
      $('#to').value = c.email || '';
      $('#drawer').classList.add('open');
    });
    bindCopy();
  }

  function bindCopy() {
    document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      const v = b.dataset.copy;
      if (!v) return;
      navigator.clipboard?.writeText(v).catch(() => {});
      const t = $('#toast');
      t.textContent = 'Copied ' + v;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1200);
    }));
  }

  $('#q').addEventListener('input', (e) => { query = e.target.value; renderList(); });
  $('#seg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    $('#seg').querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); filter = b.dataset.f; renderList();
  }));
  $('#drawer-close').addEventListener('click', () => $('#drawer').classList.remove('open'));
  $('#drawer-cancel').addEventListener('click', () => $('#drawer').classList.remove('open'));
  $('#drawer-send').addEventListener('click', () => {
    $('#drawer').classList.remove('open');
    const t = $('#toast'); t.textContent = 'Queued — connect your mailbox to send'; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1600);
  });
  $('#draft-ai').addEventListener('click', () => {
    $('#body').value += '\n\nP.S. Happy to share a tailored version of my CV for this role if useful.';
  });

  renderList();
  renderRecord();
</script>
</body>
</html>
